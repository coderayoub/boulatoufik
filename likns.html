<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#111827,#1f2937);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.container{
    width:90%;
    max-width:420px;
    text-align:center;
}

.logo{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    margin-bottom:20px;
}

h1{
    margin-bottom:8px;
}

p{
    color:#cbd5e1;
    margin-bottom:30px;
}

.btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    width:100%;
    text-decoration:none;
    color:white;
    font-size:18px;
    font-weight:bold;
    padding:18px;
    border-radius:15px;
    margin:15px 0;
    transition:.3s;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.btn:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.facebook{
    background:#1877F2;
}

.tiktok{
    background:#000;
}

.telegram{
    background:#229ED9;
}

.facebook:hover{
    background:#166FE5;
}

.tiktok:hover{
    background:#222;
}

.telegram:hover{
    background:#1B8BC4;
}

.footer{
    margin-top:35px;
    color:#94a3b8;
    font-size:14px;
}
</style>

</head>

    <!-- Facebook Button -->
<a href="https://www.facebook.com/share/1QrNryHmV9/" target="_blank" class="social-btn facebook">
    <i class="fab fa-facebook-f"></i>
    <span>Facebook</span>
</a>

<style>
.social-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    width:100%;
    max-width:400px;
    margin:15px auto;
    padding:18px 24px;
    border-radius:16px;
    text-decoration:none;
    color:#fff;
    font-size:20px;
    font-weight:700;
    transition:all .35s ease;
    position:relative;
    overflow:hidden;
}

/* Facebook */
.facebook{
    background:#1877F2;
    border:2px solid rgba(255,255,255,.08);
    box-shadow:
        0 0 18px rgba(24,119,242,.45),
        0 10px 25px rgba(0,0,0,.35);
}

.facebook i{
    font-size:28px;
}

/* Animated shine */
.facebook::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:60%;
    height:100%;
    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
    );
    transition:.8s;
}

.facebook:hover::before{
    left:130%;
}

.facebook:hover{
    transform:translateY(-5px) scale(1.03);
    box-shadow:
        0 0 30px rgba(24,119,242,.8),
        0 15px 35px rgba(0,0,0,.5);
}
</style>
